    <style>

        }

        * {

            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {

            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 40px 0 20px;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 10px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin: 30px 0;
            justify-content: center;
        }

        .search-bar {
            flex: 1 1 300px;
            max-width: 500px;
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-bar:focus {
            border-color: var(--accent);
        }

        .filter-select {
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            cursor: pointer;
        }

        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .recipe-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .recipe-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .card-header {
            margin-bottom: 12px;
        }

        .recipe-number {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .recipe-title {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--text-main);
            margin: 4px 0 10px;
        }

        .recipe-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }

        .tag {
            background: var(--tag-bg);
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .tag.season {
            border: 1px solid var(--accent);
            color: var(--accent);
        }

        .recipe-origin {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-style: italic;
            margin-bottom: 16px;
            border-left: 3px solid var(--accent);
            padding-left: 10px;
        }

        .recipe-section {

        }

            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 4px;

        }

        .stats-count {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        footer {
            text-align: center;
            padding: 40px 0 20px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

</head>

function renderRecipes(filterText = '', spiritFilter = 'ALL', seasonFilter = 'ALL') {
    const grid = document.getElementById('recipeGrid');
    grid.innerHTML = '';

    const filtered = recipes.filter(r => {
        const matchesText = r.name.toLowerCase().includes(filterText.toLowerCase()) || 
                            r.alcohol.toLowerCase().includes(filterText.toLowerCase()) ||
                            r.mixers.toLowerCase().includes(filterText.toLowerCase());
        const matchesSpirit = spiritFilter === 'ALL' || r.base === spiritFilter;
        const matchesSeason = seasonFilter === 'ALL' || r.season.includes(seasonFilter);

        return matchesText && matchesSpirit && matchesSeason;
    });

    document.getElementById('recipeCount').innerText = `Showing ${filtered.length} of ${recipes.length} recipes`;

    filtered.forEach(r => {
        const card = document.createElement('div');
        card.className = 'recipe-card';
        card.innerHTML = `
            <div>
                <div class="card-header">
                    <div class="recipe-number">Recipe #${r.id}</div>
                    <div class="recipe-title">${r.name}</div>
                    <div class="recipe-tags">
                        <span class="tag">${r.base}</span>
                        <span class="tag season">${r.season}</span>
                        <span class="tag">${r.glass}</span>
                    </div>
                </div>
                <div class="recipe-origin">"${r.origin}"</div>
                <div class="recipe-section">
                    <h4>Alcohol Base</h4>
                    <p><strong>${r.alcohol}</strong></p>
                </div>
                <div class="recipe-section">
                    <h4>Mixers Needed</h4>
                    <p>${r.mixers}</p>
                </div>
                <div class="recipe-section">
                    <h4>Method</h4>
                    <p>${r.method}</p>
                </div>
            </div>
        `;
        grid.appendChild(card);
    });
}

// Event Listeners
document.getElementById('searchInput').addEventListener('input', (e) => {
    renderRecipes(e.target.value, document.getElementById('spiritFilter').value, document.getElementById('seasonFilter').value);
});

document.getElementById('spiritFilter').addEventListener('change', (e) => {
    renderRecipes(document.getElementById('searchInput').value, e.target.value, document.getElementById('seasonFilter').value);
});

document.getElementById('seasonFilter').addEventListener('change', (e) => {
    renderRecipes(document.getElementById('searchInput').value, document.getElementById('spiritFilter').value, e.target.value);
});

// Initial Render
