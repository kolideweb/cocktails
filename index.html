            border-radius: 8px;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: var(--text-main);
            font-size: 1rem;
            outline: none;

            background: var(--card-bg);
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            cursor: pointer;
        }

            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .recipe-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .card-header {
            margin-bottom: 12px;
        }

        .recipe-number {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

            font-size: 1.35rem;
            font-weight: 600;
            color: var(--text-main);
            margin: 4px 0 10px;
        }

        .recipe-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }

        .tag {
            background: var(--tag-bg);
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .tag.season {
            border: 1px solid var(--accent);
            color: var(--accent);
        }

            font-size: 0.9rem;
            color: var(--text-muted);
            font-style: italic;
            margin-bottom: 16px;
            border-left: 3px solid var(--accent);

function renderRecipes(filterText = '', spiritFilter = 'ALL', seasonFilter = 'ALL') {
    const grid = document.getElementById('recipeGrid');
    grid.innerHTML = '';

    const filtered = recipes.filter(r => {
        const matchesText = r.name.toLowerCase().includes(filterText.toLowerCase()) || 
                            r.ingredients.some(i => i.toLowerCase().includes(filterText.toLowerCase()));
        const matchesSpirit = spiritFilter === 'ALL' || r.base === spiritFilter;
        const matchesSeason = seasonFilter === 'ALL' || r.season.includes(seasonFilter);

        return matchesText && matchesSpirit && matchesSeason;
    });

    document.getElementById('recipeCount').innerText = `Showing ${filtered.length} of ${recipes.length} recipes`;

    filtered.forEach(r => {
        const card = document.createElement('div');
        card.className = 'recipe-card';
        
        let ingredientsHTML = r.ingredients.map(ing => `<li>${ing}</li>`).join('');

        card.innerHTML = `
            <div>
                <div class="card-header">
                    <div class="recipe-number">Recipe #${r.id}</div>
                    <div class="recipe-title">${r.name}</div>
                    <div class="recipe-tags">
                        <span class="tag">${r.base}</span>
                        <span class="tag season">${r.season}</span>
                        <span class="tag">${r.glass}</span>
                    </div>
                </div>
                <div class="recipe-origin">"${r.origin}"</div>
                <div class="recipe-section">
                    <h4>Exact Ingredients</h4>
                    <ul>${ingredientsHTML}</ul>
                </div>
                <div class="recipe-section" style="margin-top: 10px;">
                    <h4>Method</h4>
                    <p>${r.method}</p>
                </div>
            </div>
        `;
        grid.appendChild(card);
    });
}

// Event Listeners
document.getElementById('searchInput').addEventListener('input', (e) => {
    renderRecipes(e.target.value, document.getElementById('spiritFilter').value, document.getElementById('seasonFilter').value);
});

document.getElementById('spiritFilter').addEventListener('change', (e) => {
    renderRecipes(document.getElementById('searchInput').value, e.target.value, document.getElementById('seasonFilter').value);
});

document.getElementById('seasonFilter').addEventListener('change', (e) => {
    renderRecipes(document.getElementById('searchInput').value, document.getElementById('spiritFilter').value, e.target.value);
});

// Initial Render
renderRecipes();
